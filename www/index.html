<html lang="es">
<head>
<meta charset="utf-8">

<title>Expressing Fantasy</title>
<script src="android-bridge.js"></script>
<link href="fonts/fonts.css" rel="stylesheet">
<style>
/* VOICE: heroic, luminous fantasy RPG — warm gold on deep sea-night glass
   IDEA: an adventurer's enchanted field kit: gilded glass plates over a living island
   PICTURE: the 3D island itself, always full-screen behind every menu
   COLOUR and TYPE: night teal #0b1620, gold #f0c35a, ember red HP, arcane blue XP; Cinzel titles + Nunito Sans
   LAYOUT: HUD hugs corners and safe areas; touch cluster bottom-right, joystick left; panels centred, scrollable */
:root{--gold:#f0c35a;--gold2:#ffe3a1;--ink:#f4efe4;--mute:#b9c3cc;--panel:rgba(12,21,33,.88);--panel2:rgba(255,255,255,.06);--line:rgba(240,195,90,.32);--hp:#e5484d;--xp:#7c8cff;--ok:#5ad08a;--bad:#ff6b6b;--u:clamp(12px,calc(.9vmin + 7px),16px);color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html,body{margin:0;height:100%;overflow:hidden;background:#0b1620;color:var(--ink);font:var(--u)/1.4 'Nunito Sans',system-ui,'Hiragino Sans','Noto Sans JP',sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;inset:0}#game canvas{display:block;width:100%!important;height:100%!important;outline:none}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:.5em .9em;min-height:40px;transition:background .15s,transform .1s}
button:hover{background:rgba(240,195,90,.16)}button:active{transform:scale(.97)}button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.gold-btn{background:linear-gradient(180deg,#f6cf6e,#d59b2c);color:#1d1305;border-color:#ffe3a1;font-weight:800}
.gold-btn:hover{background:linear-gradient(180deg,#ffe08a,#e4ab39)}
h1,h2,h3{font-family:Cinzel,Georgia,serif;margin:0;line-height:1.1}
small,.note{color:var(--mute)}.note{font-size:.85em;margin:.5em 0 0}
.hide,[hidden]{display:none!important}
/* ---- HUD ---- */
#hud{position:fixed;inset:0;pointer-events:none}
#hud button{pointer-events:auto}
.glass{background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#pcard{position:absolute;top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));width:clamp(168px,30vw,290px);padding:8px 11px 9px}
#pcard .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
#hName{font-family:Cinzel,serif;font-weight:800;color:var(--gold2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{position:relative;height:clamp(12px,calc(1.2vmin + 6px),17px);background:rgba(255,255,255,.1);border-radius:7px;overflow:hidden;margin-top:5px}
.bar i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,#b8262c,var(--hp));transition:width .15s}
.bar.xp i{background:linear-gradient(90deg,#4a58d8,var(--xp))}
.bar.boss i{background:linear-gradient(90deg,#7a1fb0,#e0486e)}
.bar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.72em;font-weight:800;text-shadow:0 1px 2px #000;white-space:nowrap}
#hGold{margin-top:5px;font-weight:800;color:var(--gold);font-size:.9em;white-space:nowrap}
#pcard .bar.st{height:6px;margin-top:4px}.bar.st i{background:linear-gradient(90deg,#3fbf6a,#9dffa8)}.bar.st.low i{background:linear-gradient(90deg,#b8262c,#ff8a5a)}
#combo{position:absolute;right:calc(max(14px,env(safe-area-inset-right)) + 10px);top:42%;text-align:right;font-family:Cinzel,serif;font-weight:800;color:#fff3c4;text-shadow:0 2px 8px #000,0 0 18px rgba(240,195,90,.7);pointer-events:none}#combo b{display:block;font-size:clamp(34px,6vmin,58px);line-height:1;color:#ffd24a;font-style:italic}#combo span{font-size:.85em;letter-spacing:.06em}#combo.pop b{animation:cpop .18s ease-out}@keyframes cpop{from{transform:scale(1.35)}to{transform:none}}
body.touch #combo{top:30%}
#hBuffs{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}#hBuffs b{font-size:.7em;padding:1px 6px;border-radius:6px;background:rgba(124,140,255,.22);border:1px solid rgba(124,140,255,.5)}#hBuffs b.curse{background:rgba(0,200,255,.15);border-color:#3fd7ff;color:#bff3ff}
#mmWrap{position:absolute;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));width:clamp(104px,21vmin,176px);text-align:center}
#mm{width:100%;aspect-ratio:1;border-radius:50%;border:2px solid var(--gold);box-shadow:0 4px 18px rgba(0,0,0,.5);background:#16324a;display:block}
#zoneName{margin-top:4px;font-size:.78em;font-weight:800;color:var(--gold2);text-shadow:0 1px 3px #000}
#clock,#fpsT{font-size:.7em;color:var(--mute);text-shadow:0 1px 2px #000}
#topBtns{position:absolute;top:max(10px,env(safe-area-inset-top));right:calc(max(10px,env(safe-area-inset-right)) + clamp(104px,21vmin,176px) + 8px);display:flex;flex-direction:column;gap:6px}
#topBtns button{min-height:38px;padding:.3em .7em;font-size:.82em;font-weight:800;background:var(--panel)}
#bossBar{position:absolute;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);width:min(46vw,520px);padding:6px 12px 8px;text-align:center}
#bossName{font-family:Cinzel,serif;font-weight:800;color:#ffc6d2;font-size:.9em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#prompt{position:absolute;left:50%;bottom:calc(max(14px,env(safe-area-inset-bottom)) + 92px);transform:translateX(-50%);padding:8px 14px;font-weight:800;white-space:nowrap;font-size:.9em}
#prompt kbd{display:inline-block;background:var(--gold);color:#1d1305;border-radius:5px;padding:0 6px;margin-right:6px}
#skillbar{position:absolute;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:8px}
.sk{position:relative;width:62px;height:62px;border-radius:14px;padding:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.66em;font-weight:800;line-height:1.1;text-align:center;overflow:hidden;background:var(--panel)}
.sk kbd{position:absolute;top:2px;left:5px;font-size:.95em;color:var(--gold)}
.sk::after{content:'';position:absolute;left:0;right:0;bottom:0;height:calc(var(--cd,0)*100%);background:rgba(0,0,0,.62);pointer-events:none}
.sk .n{position:absolute;bottom:2px;right:5px;color:var(--gold2)}
#touch{display:none}
body.touch #touch{display:block}body.touch #skillbar{display:none}body.touch #prompt kbd{display:none}
#joyBase{position:absolute;width:clamp(110px,26vmin,150px);aspect-ratio:1;border-radius:50%;border:2px solid rgba(240,195,90,.45);background:radial-gradient(circle,rgba(255,255,255,.08),rgba(0,0,0,.25));left:calc(max(18px,env(safe-area-inset-left)) + 10px);bottom:calc(max(18px,env(safe-area-inset-bottom)) + 10px);transform:translate(0,0);opacity:.55;transition:opacity .2s}
#joyBase.on{opacity:.95}
#joyKnob{position:absolute;left:50%;top:50%;width:44%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9b0,#c98d24);transform:translate(-50%,-50%);box-shadow:0 3px 10px rgba(0,0,0,.5)}
#tBtns{position:absolute;right:max(14px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));width:clamp(190px,46vmin,260px);aspect-ratio:1}
#tBtns button{position:absolute;border-radius:50%;padding:0;font-size:clamp(10px,2.3vmin,13px);font-weight:800;background:var(--panel);border:2px solid var(--line);min-height:0;overflow:hidden;line-height:1.05}
#tBtns button::after{content:'';position:absolute;left:0;right:0;bottom:0;height:calc(var(--cd,0)*100%);background:rgba(0,0,0,.6)}
#tAtk{width:40%;height:40%;right:4%;bottom:4%;background:radial-gradient(circle at 40% 35%,#ffd77a,#b4761c)!important;color:#1d1305;border-color:#ffe3a1!important;font-size:clamp(12px,2.8vmin,15px)!important}
#tDash{width:23%;height:23%;right:46%;bottom:1%;border-color:#9fe8ff!important}#tSk{width:22%;height:22%;right:44%;bottom:27%}#tUlt{width:21%;height:21%;right:30%;bottom:50%}#tJump{width:24%;height:24%;right:5%;bottom:45%}
#tPot{width:18%;height:18%;right:72%;bottom:6%}#tUse{width:22%;height:22%;right:56%;bottom:64%;border-color:#7cf0b0!important}#tCam{width:18%;height:18%;right:2%;bottom:76%}
#toasts{position:absolute;top:calc(max(10px,env(safe-area-inset-top)) + 64px);left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;width:min(92vw,560px)}
.toast{padding:8px 14px;font-weight:700;font-size:.88em;text-align:center;animation:tin .25s ease-out;max-width:100%}
.toast.big{font-family:Cinzel,serif;font-size:1.15em;color:var(--gold2);border-color:var(--gold)}
.toast.lyra{border-color:#9be7ff;color:#d8f6ff}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
#labels{position:absolute;inset:0;overflow:hidden}
.lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);text-align:center;font-size:11px;font-weight:800;white-space:nowrap;text-shadow:0 1px 2px #000,0 0 4px #000;pointer-events:none}
.lbl .b{width:64px;height:5px;margin:2px auto 0;background:rgba(0,0,0,.6);border-radius:3px;overflow:hidden}.lbl .b i{display:block;height:100%;background:var(--hp)}
.lbl.npc{color:#ffe3a1}.lbl.boss{color:#ffb3c6;font-size:13px}.lbl.boss .b{width:110px}
.dmg{position:absolute;left:0;top:0;font-weight:800;font-size:16px;color:#fff;text-shadow:0 2px 3px #000;pointer-events:none;transform:translate(-50%,-50%)}
.dmg.crit{color:#ffd24a;font-size:21px}.dmg.me{color:#ff6b6b}.dmg.heal{color:#6bff9c}
#vignette{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 120px 30px rgba(220,30,40,.65);opacity:0;transition:opacity .25s}
#cross{position:absolute;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px rgba(0,0,0,.5);display:none}
body.fp #cross{display:block}
/* ---- Panels ---- */
#panel{position:fixed;inset:0;background:rgba(4,10,18,.55);display:flex;align-items:center;justify-content:center;padding:max(10px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));z-index:5}
#panel[hidden]{display:none}
.pbox{position:relative;width:min(1000px,100%);height:min(720px,100%);display:flex;flex-direction:column;overflow:hidden}
.ptop{display:flex;align-items:center;gap:8px;padding:8px 8px 0 10px}
#ptabs{display:flex;gap:6px;overflow-x:auto;flex:1;padding-bottom:8px;scrollbar-width:thin}
#ptabs button{flex:none;font-weight:800;font-size:.88em;white-space:nowrap}
#ptabs button.on{background:var(--gold);color:#1d1305;border-color:var(--gold2)}
#pClose{flex:none;width:44px;height:44px;font-size:1.4em;line-height:1;padding:0;margin-bottom:8px}
#pbody{flex:1;overflow-y:auto;padding:4px 12px 16px;-webkit-overflow-scrolling:touch;touch-action:pan-y;user-select:text;-webkit-user-select:text}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.card{background:var(--panel2);border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:12px}
.card h3{color:var(--gold2);font-size:1.05em;margin-bottom:8px}
.kv{width:100%;border-collapse:collapse}.kv td{padding:4px 0;border-bottom:1px solid rgba(255,255,255,.06)}.kv td:last-child{text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:6px}
.it{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06)}
.it .dot{flex:none;width:12px;height:12px;border-radius:50%}
.it .main{flex:1;display:flex;flex-direction:column}
.it .main b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .main small{font-size:.8em}
.it .acts{display:flex;gap:6px;flex:none}.it .acts button{min-height:36px;padding:.3em .7em;font-size:.82em;font-weight:800}
.it.lock{opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{font-size:.88em}.chips button.on{background:var(--gold);color:#1d1305;border-color:var(--gold2);font-weight:800}
.mats{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:6px}
.mats div{display:flex;justify-content:space-between;padding:6px 9px;border-radius:8px;background:rgba(255,255,255,.04);font-size:.88em}.mats b{font-variant-numeric:tabular-nums}
.tree{display:grid;gap:10px}.trow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:10px}
.node{padding:10px;border-radius:12px;border:1px solid var(--line);background:rgba(240,195,90,.05)}.node b{color:var(--gold2)}.node.off{opacity:.45}
.node .pips{display:flex;gap:3px;margin:6px 0}.node .pips i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.12)}.node .pips i.on{background:var(--gold)}
.set{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}.set label{display:block;font-weight:800;margin-bottom:6px}
select,input[type=text]{width:100%;min-height:44px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:#0f1c2b;font-size:16px}
input[type=range]{width:100%;accent-color:var(--gold);height:30px}
canvas#bigmap{width:100%;max-width:640px;aspect-ratio:1;display:block;margin:0 auto;border-radius:14px;border:1px solid var(--line);background:#16324a}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:6px;margin-top:10px}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.credits-hero{text-align:center;padding:24px 10px}.credits-hero h2{font-size:clamp(28px,6vw,46px);color:var(--gold);margin-bottom:8px}
.credits-hero .names{font-size:1.15em;font-weight:800;margin:18px 0;display:grid;gap:6px}
/* ---- Title ---- */
#title{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:max(14px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(14px,env(safe-area-inset-left));background:radial-gradient(ellipse at 50% 40%,rgba(11,22,32,.15),rgba(6,12,20,.78) 75%);z-index:6;overflow-y:auto;touch-action:pan-y}
.tcard{width:min(560px,100%);padding:clamp(16px,4vw,28px);text-align:center;max-height:100%;overflow-y:auto}
.tcard h1{font-size:clamp(30px,7.2vw,52px);color:var(--gold);letter-spacing:.02em;text-shadow:0 3px 18px rgba(240,195,90,.35)}
.tcard .tag{margin:.4em 0 1.1em;color:var(--mute)}
.tcard .stack{display:grid;gap:10px;text-align:left}
.tcard .stack label{font-weight:800;font-size:.9em;color:var(--gold2)}
.tcard .btns{display:grid;gap:10px;margin-top:6px}
.tcard .btns button{min-height:48px;font-weight:800;font-size:1.02em}
.tcard .credits{margin-top:16px;font-size:.82em;color:var(--mute)}.tcard .credits b{color:var(--ink)}
.chip-desc{font-size:.8em;color:var(--mute);min-height:1.2em}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:min(18px,2.6vh);background:radial-gradient(ellipse at 50% 35%,#1d3550 0%,#0b1620 60%,#060b12 100%);z-index:50;font-family:Cinzel,serif;color:var(--gold);text-align:center;padding:20px;overflow:hidden;transition:opacity .6s ease}
#loading.out{opacity:0;pointer-events:none}
#loading .ld-sky{position:absolute;inset:-20%;background:radial-gradient(2px 2px at 20% 30%,#fff8,transparent),radial-gradient(2px 2px at 70% 20%,#fff6,transparent),radial-gradient(1.5px 1.5px at 40% 70%,#fff5,transparent),radial-gradient(2px 2px at 85% 60%,#fff7,transparent),radial-gradient(1.5px 1.5px at 10% 80%,#fff5,transparent);animation:ldDrift 40s linear infinite;will-change:transform}
#loading .ld-isle{position:relative;flex-shrink:0;width:min(46vw,190px,34vh);aspect-ratio:1;animation:ldFloat 4s ease-in-out infinite;will-change:transform}
#loading .ld-isle svg{width:100%;height:100%;filter:drop-shadow(0 10px 22px rgba(124,240,255,.25))}
#loading .ld-title{position:relative;font-size:clamp(1.5em,5vw,2.4em);letter-spacing:.06em;text-shadow:0 0 18px rgba(240,195,90,.45)}
#loading .ld-barw{position:relative;flex-shrink:0;width:min(78vw,420px);height:12px;min-height:12px;border-radius:99px;background:rgba(255,255,255,.08);box-shadow:inset 0 0 0 1px rgba(240,195,90,.35);overflow:hidden}
#loading .ld-bar{position:absolute;inset:0;transform-origin:0 50%;transform:scaleX(.02);background:linear-gradient(90deg,#d6a24a,#f0c35a,#fff0b0);border-radius:99px;transition:transform .35s ease;will-change:transform}
#loading .ld-shine{position:absolute;top:0;bottom:0;width:30%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);animation:ldShine 1.3s linear infinite;will-change:transform}
#loading .ld-txt{position:relative;font-family:system-ui,sans-serif;font-size:.85em;color:#cfe3f0;min-height:1.3em}
#loading .ld-tip{position:relative;font-family:system-ui,sans-serif;font-size:.78em;color:#8fb0c4;max-width:min(86vw,460px);min-height:2.6em}
#loading .ld-spin{width:26px;height:26px;border-radius:50%;border:3px solid rgba(240,195,90,.2);border-top-color:#f0c35a;animation:ldSpin .9s linear infinite;will-change:transform}
@keyframes ldSpin{to{transform:rotate(360deg)}}@keyframes ldShine{from{transform:translateX(-120%)}to{transform:translateX(420%)}}@keyframes ldFloat{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-10px) rotate(1deg)}}@keyframes ldDrift{to{transform:translate(-8%,4%)}}
@media (max-width:600px){#topBtns{flex-direction:row;top:auto;right:auto;left:max(10px,env(safe-area-inset-left));top:calc(max(10px,env(safe-area-inset-top)) + 118px)}#bossBar{top:calc(max(10px,env(safe-area-inset-top)) + 168px);width:86vw}#toasts{top:calc(max(10px,env(safe-area-inset-top)) + 210px)}}
@media (max-height:460px){#pcard{width:clamp(160px,26vw,240px);padding:6px 9px}#toasts{top:max(8px,env(safe-area-inset-top))}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}

/* ---- v3 ---- */
:root{--bb:0px}body.badge{--bb:64px}
#skillbar{bottom:calc(max(14px,env(safe-area-inset-bottom)) + var(--bb))}
#tBtns{bottom:calc(max(14px,env(safe-area-inset-bottom)) + var(--bb))}
#joyBase{bottom:calc(max(18px,env(safe-area-inset-bottom)) + 10px + var(--bb))}
#prompt{bottom:calc(max(14px,env(safe-area-inset-bottom)) + 92px + var(--bb))}
body.touch #prompt{bottom:calc(max(14px,env(safe-area-inset-bottom)) + clamp(200px,48vmin,270px) + var(--bb))}
#hTitle{font-size:.72em;font-weight:800;color:#c8b6ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:0}
#hTitle:empty{display:none}
#pcard .bar.food{height:5px;margin-top:3px}.bar.food i{background:linear-gradient(90deg,#c87a2a,#ffc06a)}.bar.food.low i{background:linear-gradient(90deg,#8a2a2a,#ff6a4a);animation:blink 1s infinite}
@keyframes blink{50%{opacity:.4}}
#oxyBar{position:absolute;left:50%;top:calc(max(10px,env(safe-area-inset-top)) + 58px);transform:translateX(-50%);width:min(52vw,300px);padding:5px 10px 7px;text-align:center;font-size:.75em;font-weight:800;color:#bfefff}
.bar.oxy{margin-top:3px;height:9px}.bar.oxy i{background:linear-gradient(90deg,#2a8ad0,#9fe8ff)}

const CELL=16,CGRID=new Map(),COLL=[];let TREE_FRAC=1;
const ck=(i,j)=>i*100003+j;
function addCol(x,z,r,tier){const c={x,z,r,t:tier};const pd=r+1.5,i0=Math.floor((x-pd)/CELL),i1=Math.floor((x+pd)/CELL),j0=Math.floor((z-pd)/CELL),j1=Math.floor((z+pd)/CELL);for(let i=i0;i<=i1;i++)for(let j=j0;j<=j1;j++){const k=ck(i,j);let a=CGRID.get(k);if(!a)CGRID.set(k,a=[]);a.push(c)}return c}
function solid(x,z,r){COLL.push({x,z,r});return addCol(x,z,r)}
// v9: pirámides escalonadas sólidas por niveles (se puede subir por fuera, no se atraviesan caminando ni volando)
const PYRC=[];
function addPyr(x,z,ry,base,steps){const H=steps[0][0],c=addBox(x,z,H,H,ry,steps[steps.length-1][1]);c.pyr=1;c.base=base;c.steps=steps;PYRC.push(c);return c}
function pyrLocal(c,x,z){const dx=x-c.x,dz=z-c.z;return[dx*c.cs-dz*c.sn,dx*c.sn+dz*c.cs]}
function pyrTop(x,z){let best=-1e9;for(const c of PYRC){const R=c.bx+.5;if(Math.abs(x-c.x)>R*1.42||Math.abs(z-c.z)>R*1.42)continue;const[lx,lz]=pyrLocal(c,x,z),d=Math.max(Math.abs(lx),Math.abs(lz));let tp=-1;for(const s of c.steps)if(s[0]>=d)tp=s[1];if(tp>=0&&c.base+tp>best)best=c.base+tp}return best}
function pyrPush(c,o,rad){const rel=(o.y===undefined?c.base:o.y)-c.base;let w=-1;for(const s of c.steps)if(s[1]>rel+.75){w=s[0];break}if(w<0)return false;let[lx,lz]=pyrLocal(c,o.x,o.z);const e=w+rad;if(Math.abs(lx)>=e||Math.abs(lz)>=e)return false;if(e-Math.abs(lx)<e-Math.abs(lz))lx=Math.sign(lx||1)*e;else lz=Math.sign(lz||1)*e;o.x=c.x+lx*c.cs+lz*c.sn;o.z=c.z-lx*c.sn+lz*c.cs;return true}
function addBox(x,z,hx,hz,ry,h){const c=addCol(x,z,Math.hypot(hx,hz));c.bx=hx;c.bz=hz;c.cs=Math.cos(ry);c.sn=Math.sin(ry);c.h=h||20;return c}
function inBoxC(c,x,z,pad){const dx=x-c.x,dz=z-c.z,lx=dx*c.cs-dz*c.sn,lz=dx*c.sn+dz*c.cs;return Math.abs(lx)<c.bx+pad&&Math.abs(lz)<c.bz+pad}
function boxPush(c,o,rad){const dx=o.x-c.x,dz=o.z-c.z;let lx=dx*c.cs-dz*c.sn,lz=dx*c.sn+dz*c.cs;const ex=c.bx+rad,ez=c.bz+rad;if(Math.abs(lx)>=ex||Math.abs(lz)>=ez)return false;if(ex-Math.abs(lx)<ez-Math.abs(lz))lx=Math.sign(lx||1)*ex;else lz=Math.sign(lz||1)*ez;o.x=c.x+lx*c.cs+lz*c.sn;o.z=c.z-lx*c.sn+lz*c.cs;return true}
function pushOut(o,rad){const a=CGRID.get(ck(Math.floor(o.x/CELL),Math.floor(o.z/CELL)));if(!a)return false;let hit=false;for(const c of a){if(c.off||(c.t!==undefined&&c.t>=TREE_FRAC))continue;if(c.bx){if(c.pyr?pyrPush(c,o,rad):boxPush(c,o,rad))hit=true;continue}const dx=o.x-c.x,dz=o.z-c.z,rr=c.r+rad,d2=dx*dx+dz*dz;if(d2<rr*rr){const d=Math.sqrt(d2)||.001;o.x=c.x+dx/d*rr;o.z=c.z+dz/d*rr;hit=true}}return hit}

const bestTool=kind=>Object.keys(S.inv.t||{}).filter(k=>S.inv.t[k]>0&&TOOLS[k]&&TOOLS[k].kind===kind).reduce((m,k)=>Math.max(m,TOOLS[k].pow),0);
function inBubble(x,y,z){return Math.hypot(x-BUBBLE.x,z-BUBBLE.z)<BUBBLE.r-1&&y<BUBBLE.floor+BUBBLE.r*.92}
function startAction(type,dur,done,o){if(P.action||P.dead)return;P.action={type,t:0,dur,done,o};P.swing=1;P.step=2;sfx(type==='mine'?'mine':type==='chop'?'chop':type==='dig'?'dig':'gather')}
function tickAction(dt){const a=P.action;if(!a)return;a.t+=dt;if(Math.floor(a.t/.45)!==Math.floor((a.t-dt)/.45)){P.swing=1;if(a.type!=='gather'&&a.type!=='tame')sfx(a.type==='mine'?'mine':a.type==='chop'?'chop':'dig')}if(a.t>=a.dur){P.action=null;a.done()}}
function mineOre(o){const pw=bestTool('pick'),hard=ORE_HARD[o.type]||1;if(pw<hard){toast(t('msg_needtool',t('t_pick'+Math.min(4,hard))));return}const st=stats();
 startAction('mine',1.6/(1+(pw-hard)*.25)/Math.min(2.5,st.mine),()=>{const n=Math.max(1,Math.round((1+Math.floor(Math.random()*3))*st.mine));addMat(o.type,n);if(o.type!=='stone')addMat('stone',1);toast(t('msg_get',t('m_'+o.type)+' ×'+n));o.t=150;NODE_DIRTY=true;S.st.mined=(S.st.mined||0)+1;questMine();checkProgress()})}
function gatherNode(g,i){startAction('gather',.7,()=>{const n=1+Math.floor(Math.random()*2);addMat(g.type,n);toast(t('msg_get',t((FOOD[g.type]?'f_':'m_')+g.type)+' ×'+n));g.t=100;NODE_DIRTY=true})}
function digSpot(d){if(!bestTool('shovel')){toast(t('msg_needtool',t('t_shovel')));return}startAction('dig',1.6,()=>{const st=stats(),lv=Math.max(5,S.level);d.t=600;addGold(rint(40,120)*lv*.3*st.gold);toast(t('msg_get',fmt(rint(40,120)*lv*.3)+' '+t('gold')));if(Math.random()<.35){const w=rollWeapon(lv+5,'dig',st.luck);if(w)addWeapon(w)}else{const m=['gold','pearl','platinum','mithril'][Math.floor(Math.random()*4)];addMat(m,1+Math.floor(Math.random()*2))}})}
const CHOP=new WeakMap();
function chopTree(c){const pw=bestTool('axe');if(!pw){toast(t('msg_needtool',t('t_axe1')));return}if((CHOP.get(c)||0)>performance.now())return;startAction('chop',1.3/pw,()=>{const n=1+pw+Math.floor(Math.random()*2);addMat('wood',n);toast(t('msg_get',t('m_wood')+' ×'+n));CHOP.set(c,performance.now()+120000);if(Math.random()<.2&&biomeAt(P.x,P.z)===0)addMat('apple',1)})}
function nearTree(){const a=CGRID.get(ck(Math.floor(P.x/CELL),Math.floor(P.z/CELL)));if(!a)return null;let best=null,bd=2.4;for(const c of a){if(c.t===undefined||c.t>=TREE_FRAC||c.r>1.4)continue;const d=Math.hypot(P.x-c.x,P.z-c.z)-c.r;if(d<bd){bd=d;best=c}}return best}

let lavaT=0,hungerWarn=false;
function updateSurvival(dt){const st=stats();
 if(!P.dead){const drain=(P.sprint?1.8:1)*(1-st.hungerRes)*dt/13.2;S.hunger=Math.max(0,S.hunger-drain);if(S.hunger<20&&!hungerWarn){hungerWarn=true;toast(t('msg_hungry'))}if(S.hunger>30)hungerWarn=false;if(S.hunger<=0)P.hp-=st.maxHp*.01*dt}
 if(P.under&&!P.inBubble&&P.buff.oxy<=0){P.oxy=Math.max(0,P.oxy-dt);if(P.oxy<=0){P.drownT=(P.drownT||0)-dt;if(P.drownT<=0){P.drownT=1;hurtPlayer(st.maxHp*.05,{raw:true});toast(t('msg_drown'))}}}else P.oxy=Math.min(st.oxyMax,P.oxy+st.oxyMax*dt/3);
 if(P.poison>0){P.poison-=dt;P.pT=(P.pT||0)-dt;if(P.pT<=0){P.pT=1;hurtPlayer(Math.max(1,(P.poisonDmg||5)),{raw:true})}}if(P.slow>0)P.slow-=dt;if(P.regenBuff>0)P.regenBuff-=dt;
 if(P.zone==='world'&&P.onGround&&(biomeAt(P.x,P.z)===5||biomeAt(P.x,P.z)===17)){lavaT-=dt;if(lavaT<=0&&LAVA.some(l=>Math.hypot(P.x-l.x,P.z-l.z)<l.r)){lavaT=.6;burnHit(2.4)}}
 if(P.hp<=0&&!P.dead){P.hp=0;P.dead=true;P.deadT=2.5;dismount();toast(t('msg_dead'))}}

function npcMerge(g){mergeStatic(g);g.userData.merged=1;g.userData.p=null;return g}
NPCS.forEach(n=>{const h=NPC_HOME[n.id],L=n.look,isle=typeof n.loc==='number'&&n.loc>10?n.loc-10:0;const hatBy={guard:'helm',miner:'band',fisher:'hood',priest:'hood',merchant:'merchant',sailor:'band'};

function qText(n){const q=n.q;if(q.type==='hunt')return t('q_hunt',t('e_'+q.target),q.n);if(q.type==='gather')return t('q_gather',t((FOOD[q.target]?'f_':'m_')+q.target),q.n);if(q.type==='explore')return t('q_explore',t(EXPLORE_T[n.loc].k));return t('q_mine',0,q.n)}
function qState(n){if((S.qdone||[]).includes(n.id))return'done';const a=S.quests[n.id];if(!a)return'none';return qProg(n)>=n.q.n?'ready':'active'}
function qProg(n){const a=S.quests[n.id];if(!a)return 0;if(n.q.type==='gather')return Math.min(n.q.n,(S.inv.m[n.q.target]||0)+(S.inv.f[n.q.target]||0));return a.p||0}
function questKill(type){for(const id in S.quests){const n=NPCS.find(x=>x.id===id);if(n&&n.q.type==='hunt'&&n.q.target===type){S.quests[id].p=(S.quests[id].p||0)+1;if(S.quests[id].p===n.q.n)toast(t('d_done').split('!')[0]+' · '+n.name)}}}
function questMine(){for(const id in S.quests){const n=NPCS.find(x=>x.id===id);if(n&&n.q.type==='mine')S.quests[id].p=(S.quests[id].p||0)+1}}

 cfg(){const raw=SET.fb||FB_DEFAULT;if(!raw)return null;if(typeof raw==='object')return raw;try{return JSON.parse(raw)}catch(e){}const o={};raw.replace(/(\w+)\s*:\s*["']([^"']+)["']/g,(m,k,v)=>{o[k]=v});return o.apiKey&&o.projectId?o:null},
 async load(){const v='10.12.2',b='https://www.gstatic.com/firebasejs/'+v+'/';for(const f of ['firebase-app-compat.js','firebase-auth-compat.js','firebase-firestore-compat.js'])await new Promise((res,rej)=>{if(f.includes('app')&&window.firebase)return res();const s=document.createElement('script');s.src=b+f;s.onload=res;s.onerror=rej;document.head.appendChild(s)})},

 async login(){try{await this.init();await window.firebase.auth().signInWithPopup(new window.firebase.auth.GoogleAuthProvider());toast(t('fb_hi',this.user.displayName||''),'big');await this.pull(true)}catch(e){toast('Google: '+(e.message||e))}},
 async logout(){try{await window.firebase.auth().signOut()}catch(e){}this.user=null},
 push(){if(!this.user||!this.db||Date.now()-this.last<30000)return;this.last=Date.now();this.db.collection('saves').doc(this.user.uid).set({save:JSON.stringify(S),t:Date.now(),lv:S.level,name:S.name}).catch(()=>{})},
 async pull(ask){if(!this.user)return;const d=await this.db.collection('saves').doc(this.user.uid).get();if(!d.exists){this.last=0;this.push();return}const v=d.data(),loc=store.get(SAVE_KEY);if(!loc||(v.lv||0)>=(loc.level||0)){store.set(SAVE_KEY,JSON.parse(v.save));toast(t('fb_load')+' ✓','big');setTimeout(()=>location.reload(),900)}}};
